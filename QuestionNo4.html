<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Calculator</title>
</head>
<style>
    .body-parent {
        background-color: rgb(7, 8, 8);
    }

    .calculator {
        width: 500px;
        height: 500px;
        /* border: 1px solid rgb(250, 249, 249); */
    }

    .buttons {
        display: grid;
        grid-template-columns: repeat(4, 60px);
        gap: 10px;
        padding: 4px;
        margin: 12px;
    }

    button {
        padding: 16px;
        border-radius: 12px;
        color: orange;
        border: none;
    }

    #inputBox {
        width: 238px;
        padding: 16px;
        margin: 12px;
    }
</style>

<body class="body-parent">
    <div class="calculator">
        <input type="text" id="inputBox" readonly />
        <div class="buttons">
            <button class="clear">AC</button>
            <button class="operator">DEL</button>
            <button class="operator">%</button>
            <button class="operator">/</button>
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="operator">*</button>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="operator">-</button>
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="operator">+</button>
            <button>0</button>
            <button>00</button>
            <button>.</button>
            <button class="equal">=</button>
        </div>
    </div>
</body>
<script>
    let input = document.getElementById('inputBox');
    let buttons = document.querySelectorAll('button');
    let string = "";
    let arr = Array.from(buttons);
    arr.forEach(button => {
        button.addEventListener('click', (e) => {
            if (e.target.innerHTML == '=') {
                try {
                    string = eval(string);
                    input.value = string;
                } catch {
                    input.value = "Error";
                    string = "";
                }
            } else if (e.target.innerHTML == 'AC') {
                string = "";
                input.value = string;
            } else if (e.target.innerHTML == 'DEL') {
                string = string.substring(0, string.length - 1);
                input.value = string;
            } else {
                string += e.target.innerHTML;
                input.value = string;
            }
        });
    });
</script>


</html>
